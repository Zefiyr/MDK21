<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body">
        <h1>Заявки корпуса</h1>

        <section class="form">
            <div class="field">
                <label for="title">Что случилось?</label>
                <input type="text" id="title" placeholder="Что случилось?">
            </div>

            <div class="field">
                <label for="room">Где?</label>
                <input type="text" id="room" placeholder="Где?">
            </div>

            <div class="field">
                <label for="category">Категория</label>
                <select id="category">
                    <option value="">Выберите категорию</option>
                    <option value="Оборудование">Оборудование</option>
                    <option value="Аудитория">Аудитория</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <button id="addBtn">Добавить заявку</button>
            <p id="message" class="message"></p>
        </section>

        <section class="filters">
            <label>
                <input type="checkbox" id="onlyOpen">
                Только открытые
            </label>
        </section>

        <ul id="ticketsList" class="tickets"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
